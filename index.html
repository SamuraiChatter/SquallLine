<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SquallLine</title>
    <!-- No icon yet. This stops the browser asking for one that is not there. -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <!-- The game screen. Its width and height set its shape. -->
    <canvas width="1920" height="1080"></canvas>
    <!-- The touch controls for a chase. The game shows them after a finger
         touches the screen, and fills in what the buttons say. Each button
         stands for a key. -->
    <div class="controls" hidden>
      <div class="stick"><div class="knob"></div></div>
      <button type="button" data-key="p"></button>
      <div class="buttons">
        <button type="button" data-key="z"></button>
        <button type="button" data-key="v"></button>
        <button type="button" data-key="a"></button>
        <button type="button" data-key=" "></button>
      </div>
    </div>
    <a class="credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>
  </body>
</html>
